name: Release

# Publishes a GitHub Release with the signed APK.
# Trigger it by pushing a tag like v1.1.0, or from the Actions tab (Release > Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish, e.g. v1.1.0 (default: v + versionName from app/build.gradle.kts)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Releases must always be signed with the same key, otherwise installed copies can't be updated.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          # Backslashes are escapes in .properties files, so they're doubled.
          {
            echo "storeFile=release.jks"
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
          } > keystore.properties

      - name: Determine tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          NAME=$(sed -nE 's/^ *versionName = "(.*)"/\1/p' app/build.gradle.kts | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="v$NAME"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag '$TAG' must look like v1.2.3"; exit 1 ;;
          esac
          if [ "$TAG" != "v$NAME" ]; then
            echo "::error::Tag $TAG doesn't match versionName $NAME in app/build.gradle.kts. Bump versionName (and versionCode) first."
            exit 1
          fi
          # An existing tag must point at the commit being built, or the APK wouldn't match the release's source.
          TAGGED=$(git ls-remote --tags origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | tail -1 | cut -f1)
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already exists on commit $TAGGED, not on $GITHUB_SHA. Bump the version for a new release."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Verify signature and package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          if "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is signed with a debug key"; exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "LeanCleaner-$TAG.apk"
          sha256sum "LeanCleaner-$TAG.apk" > "LeanCleaner-$TAG.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" "LeanCleaner-$TAG.apk" "LeanCleaner-$TAG.apk.sha256" \
            --title "Lean Cleaner $TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes
