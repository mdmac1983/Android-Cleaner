name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Optional: sign release builds with your own key so installed CI builds can update each other.
      # Add the repository secrets KEYSTORE_BASE64 (base64 of a .jks file), KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD. Without them, release APKs are signed with a throwaway debug key.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Release signing configured."
          else
            echo "No signing secrets; release APK will use the debug key."
          fi

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: lean-cleaner-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
